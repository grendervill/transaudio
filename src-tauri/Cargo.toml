[package]
name = "transaudio"
version = "0.2.1"
description = "Local audio and video transcription with Handy models"
authors = ["Transaudio"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "transaudio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
transcribe-cpp = "0.4.1"
sherpa-onnx = "2.0.0"
hound = "3.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
tar = "0.4"
tempfile = "3"
ffmpeg-sidecar = "2.7"
log = "0.4"
env_logger = "0.11"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
